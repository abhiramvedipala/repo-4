[project]
name = "spanscope-api"
version = "0.1.0"
description = "SpanScope ingest and query service"
requires-python = ">=3.11"
# Phase 4: fastapi + opentelemetry-proto for a wire-format-parsing POST /v1/traces (no
# persistence yet). pydantic (request validation) and asyncpg (Postgres) land in Phase 5
# alongside the real ingest/query endpoints.
dependencies = [
    "fastapi>=0.115",
    "opentelemetry-proto>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
