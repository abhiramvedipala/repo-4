[project]
name = "spanscope"
version = "0.1.0"
description = "OpenTelemetry-compatible tracing SDK for LLM applications"
requires-python = ">=3.11"
# No runtime deps — Phase 2's Tracer is stdlib-only (contextvars/queue/threading).
# opentelemetry-sdk lands in Phase 4 when we reconcile with the real OTel SDK.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
