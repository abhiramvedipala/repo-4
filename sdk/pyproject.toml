[project]
name = "spanscope"
version = "0.1.0"
description = "OpenTelemetry-compatible tracing SDK for LLM applications"
requires-python = ">=3.11"
# Phase 4: Tracer is now backed by the real OTel SDK (TracerProvider, BatchSpanProcessor,
# real Span objects) instead of Phase 2's hand-rolled queue+thread.
dependencies = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[project.optional-dependencies]
# Extras, not core deps: a user tracing only OpenAI shouldn't have to install anthropic,
# and vice versa. The wrapper modules themselves duck-type against the response shape and
# never import these at runtime (see spanscope/integrations/*.py) — they're only needed
# here so mypy can resolve the TYPE_CHECKING-only type hints in dev.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "openai>=1.40",
    "anthropic>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
